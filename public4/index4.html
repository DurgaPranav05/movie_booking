<!DOCTYPE html>
<html>
<head>
  <title>Online Movie Ticket Booking System | Durga Pranav</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkred;
        }

        nav {
            text-align: center;
            margin: 25px;
        }

        nav a {
            text-decoration: none;
            background-color: darkred;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
        }

        h2 {
            color: darkred;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-bottom: 30px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightcoral;
        }
    </style>
</head>

<body>

  <h1>Online Movie Ticket Booking System</h1>
<p style="text-align:center;">Developed by Durga Pranav</p>

    <nav>
        <a href="index4.html">Home</a>
        <a href="movies4.html">Movies</a>
        <a href="customers4.html">Customers</a>
        <a href="bookings4.html">Bookings</a>
        <a href="about4.html">About</a>
    </nav>

    <h2>Movies Details</h2>

    <table>
        <tr>
            <th>Movie ID</th>
            <th>Movie Name</th>
            <th>Genre</th>
            <th>Duration</th>
        </tr>

        <tbody id="movies"></tbody>
    </table>

    <h2>Customers Details</h2>

    <table>
        <tr>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
        </tr>

        <tbody id="customers"></tbody>
    </table>

    <h2>Bookings Details</h2>

    <table>
        <tr>
            <th>Booking ID</th>
            <th>Customer Name</th>
            <th>Movie Name</th>
            <th>Booking Date</th>
            <th>Tickets</th>
        </tr>

        <tbody id="bookings"></tbody>
    </table>

    <script>

        fetch('/movies')
        .then(response => response.json())
        .then(data => {

            let rows = "";

            data.forEach(movie => {

                rows += `
                <tr>
                    <td>${movie.movie_id}</td>
                    <td>${movie.movie_name}</td>
                    <td>${movie.genre}</td>
                    <td>${movie.duration}</td>
                </tr>`;

            });

            document.getElementById("movies").innerHTML = rows;

        });


        fetch('/customers')
        .then(response => response.json())
        .then(data => {

            let rows = "";

            data.forEach(customer => {

                rows += `
                <tr>
                    <td>${customer.customer_id}</td>
                    <td>${customer.name}</td>
                    <td>${customer.phone}</td>
                    <td>${customer.email}</td>
                </tr>`;

            });

            document.getElementById("customers").innerHTML = rows;

        });


        fetch('/bookings')
        .then(response => response.json())
        .then(data => {

            let rows = "";

            data.forEach(booking => {

                rows += `
                <tr>
                    <td>${booking.booking_id}</td>
                    <td>${booking.customer_name}</td>
                    <td>${booking.movie_name}</td>
                    <td>${booking.booking_date}</td>
                    <td>${booking.tickets}</td>
                </tr>`;

            });

            document.getElementById("bookings").innerHTML = rows;

        });

    </script>

</body>
</html>
