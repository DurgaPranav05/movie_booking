<!DOCTYPE html>
<html>
<head>
    <title>Bookings Management</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkred;
        }

        nav {
            text-align: center;
            margin: 25px;
        }

        nav a {
            text-decoration: none;
            background-color: darkred;
            color: white;
            padding: 10px;
            margin: 5px;
        }

        form {
            background-color: white;
            padding: 20px;
            width: 350px;
            margin: auto;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: darkred;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <h1>Movie Bookings Management</h1>

    <nav>
        <a href="index4.html">Home</a>
        <a href="movies4.html">Movies</a>
        <a href="customers4.html">Customers</a>
        <a href="bookings4.html">Bookings</a>
        <a href="about4.html">About</a>
    </nav>

    <h2>Add Booking</h2>

    <form id="bookingForm">

        <input type="text" id="customer_name" placeholder="Customer Name" required>

        <input type="text" id="movie_name" placeholder="Movie Name" required>

        <input type="date" id="booking_date" required>

        <input type="number" id="tickets" placeholder="Number of Tickets" min="1" required>

        <button type="submit">Book Tickets</button>

    </form>

    <h2>Bookings List</h2>

    <table>

        <tr>
            <th>Booking ID</th>
            <th>Customer Name</th>
            <th>Movie Name</th>
            <th>Booking Date</th>
            <th>Tickets</th>
            <th>Actions</th>
        </tr>

        <tbody id="bookings"></tbody>

    </table>

    <script>

        function loadBookings() {

            fetch('/bookings')
            .then(response => response.json())
            .then(data => {

                let rows = "";

                data.forEach(booking => {

                    rows += `
                    <tr>
                        <td>${booking.booking_id}</td>
                        <td>${booking.customer_name}</td>
                        <td>${booking.movie_name}</td>
                        <td>${booking.booking_date}</td>
                        <td>${booking.tickets}</td>

                        <td>
                            <button onclick="editBooking(${booking.booking_id}, '${booking.customer_name}', '${booking.movie_name}', '${booking.booking_date}', ${booking.tickets})">Edit</button>

                            <button onclick="deleteBooking(${booking.booking_id})">Delete</button>
                        </td>
                    </tr>`;

                });

                document.getElementById("bookings").innerHTML = rows;

            });

        }


        document.getElementById("bookingForm").addEventListener("submit", function(e) {

            e.preventDefault();

            fetch('/bookings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    customer_name: document.getElementById("customer_name").value,
                    movie_name: document.getElementById("movie_name").value,
                    booking_date: document.getElementById("booking_date").value,
                    tickets: document.getElementById("tickets").value
                })
            })
            .then(() => {
                this.reset();
                loadBookings();
            });

        });


        function deleteBooking(id) {

            fetch('/bookings/' + id, {
                method: 'DELETE'
            })
            .then(() => loadBookings());

        }


        function editBooking(id, customer, movie, date, tickets) {

            let newCustomer = prompt("Enter Customer Name", customer);
            let newMovie = prompt("Enter Movie Name", movie);
            let newDate = prompt("Enter Booking Date (YYYY-MM-DD)", date);
            let newTickets = prompt("Enter Number of Tickets", tickets);

            if (newCustomer && newMovie && newDate && newTickets) {

                fetch('/bookings/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        customer_name: newCustomer,
                        movie_name: newMovie,
                        booking_date: newDate,
                        tickets: newTickets
                    })
                })
                .then(() => loadBookings());

            }

        }

        loadBookings();

    </script>

</body>
</html>
